appId: com.example.testflutter
name: Tombol + menambah counter
tags:
  - regression
---
- launchApp:
    clearState: true
# Launch pertama setelah emulator boot (build debug) bisa lambat.
- extendedWaitUntil:
    visible: "Flutter Demo Home Page"
    timeout: 60000
- assertVisible: "0"
- tapOn: "Increment"
- assertVisible: "1"
- repeat:
    times: 4
    commands:
      - tapOn: "Increment"
- assertVisible: "5"

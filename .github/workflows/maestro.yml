name: Maestro E2E

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  # 1. Build APK sekali, dipakai ulang oleh semua job test.
  #    Sekalian membuat daftar flow untuk matrix, jadi flow baru di
  #    .maestro/flows/ otomatis ikut jalan tanpa mengubah workflow ini.
  build:
    runs-on: ubuntu-latest
    outputs:
      flows: ${{ steps.flows.outputs.list }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.38.10
          channel: stable
          cache: true

      - run: flutter build apk --debug

      - uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: build/app/outputs/flutter-apk/app-debug.apk

      - id: flows
        run: |
          list=$(ls .maestro/flows/*.yaml | jq -R -s -c 'split("\n") | map(select(length > 0)) | map({name: (split("/")[-1] | rtrimstr(".yaml")), path: .})')
          echo "list=$list" >> "$GITHUB_OUTPUT"

  # 2. Satu job per flow, semuanya jalan paralel, masing-masing dengan
  #    emulator headless sendiri.
  maestro:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        flow: ${{ fromJson(needs.build.outputs.flows) }}
    name: maestro (${{ matrix.flow.name }})
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: app-debug-apk

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Install Maestro
        run: |
          curl -Ls "https://get.maestro.mobile.dev" | bash
          echo "$HOME/.maestro/bin" >> "$GITHUB_PATH"

      # Wajib agar emulator x86_64 bisa pakai akselerasi hardware di runner Linux.
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      # Menyalakan emulator headless (-no-window), menunggu boot selesai,
      # mematikan animasi, menjalankan `script`, lalu mematikan emulator.
      - name: Run Maestro flow
        uses: reactivecircus/android-emulator-runner@v2
        env:
          MAESTRO_CLI_NO_ANALYTICS: 1
        with:
          api-level: 34
          # google_apis = tanpa Play Store, jadi tidak ada dialog
          # "Google Play Store keeps stopping" yang bikin flow gagal palsu.
          target: google_apis
          arch: x86_64
          disable-animations: true
          # Tiap baris dijalankan terpisah, jadi tulis satu perintah per baris.
          script: |
            adb shell settings put global hide_error_dialogs 1
            adb install -r app-debug.apk
            maestro test ${{ matrix.flow.path }} --format junit --output report-${{ matrix.flow.name }}.xml --test-output-dir maestro-output

      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: maestro-${{ matrix.flow.name }}
          path: |
            report-${{ matrix.flow.name }}.xml
            maestro-output/

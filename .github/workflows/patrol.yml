name: Patrol E2E

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

env:
  PATROL_CLI_VERSION: 4.9.0
  PATROL_ANALYTICS_ENABLED: "false"
  ALLURE_VERSION: 2.46.2

jobs:
  # 1. Daftar semua file test di patrol_test/ untuk matrix, jadi file test
  #    baru otomatis ikut jalan tanpa mengubah workflow ini.
  discover:
    runs-on: ubuntu-latest
    outputs:
      tests: ${{ steps.tests.outputs.list }}
    steps:
      - uses: actions/checkout@v4

      - id: tests
        run: |
          list=$(find patrol_test -name '*_test.dart' ! -name 'test_bundle.dart' | sort | jq -R -s -c 'split("\n") | map(select(length > 0)) | map({name: (ltrimstr("patrol_test/") | rtrimstr(".dart") | gsub("/"; "-")), path: .})')
          echo "list=$list" >> "$GITHUB_OUTPUT"

  # 2. Satu job per file test, semuanya jalan paralel, masing-masing dengan
  #    emulator headless sendiri. `patrol test` memakai Android Test
  #    Orchestrator, jadi tiap test case jalan di proses app yang bersih.
  patrol:
    needs: discover
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        test: ${{ fromJson(needs.discover.outputs.tests) }}
    name: patrol (${{ matrix.test.name }})
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.38.10
          channel: stable
          cache: true

      - name: Install Patrol CLI
        run: |
          dart pub global activate patrol_cli "$PATROL_CLI_VERSION"
          echo "$HOME/.pub-cache/bin" >> "$GITHUB_PATH"

      # Wajib agar emulator x86_64 bisa pakai akselerasi hardware di runner Linux.
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run Patrol test
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          # google_apis = tanpa Play Store, menghindari dialog crash sistem.
          target: google_apis
          arch: x86_64
          disable-animations: true
          # Tiap baris dijalankan terpisah, jadi tulis satu perintah per baris.
          script: |
            adb shell settings put global hide_error_dialogs 1
            patrol test --target ${{ matrix.test.path }}

      # JUnit XML dari Gradle: bahan laporan Allure gabungan di job `allure-report`.
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: patrol-junit-${{ matrix.test.name }}
          path: build/app/outputs/androidTest-results/connected/**/TEST-*.xml
          if-no-files-found: ignore

      # Laporan HTML Gradle + logcat per test untuk investigasi kalau gagal.
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: patrol-debug-${{ matrix.test.name }}
          path: |
            build/app/reports/androidTests/connected/debug/
            build/app/outputs/androidTest-results/connected/
          if-no-files-found: ignore

  # 3. Gabungkan hasil SEMUA file test jadi SATU laporan Allure.
  allure-report:
    needs: patrol
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: patrol-junit-*
          path: allure-results

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Install Allure
        run: |
          curl -fsSL -o "$RUNNER_TEMP/allure.zip" "https://repo.maven.apache.org/maven2/io/qameta/allure/allure-commandline/$ALLURE_VERSION/allure-commandline-$ALLURE_VERSION.zip"
          unzip -q "$RUNNER_TEMP/allure.zip" -d "$RUNNER_TEMP/allure"
          dirname "$(find "$RUNNER_TEMP/allure" -path '*/bin/allure' | head -1)" >> "$GITHUB_PATH"

      # Tiap artifact jadi satu subfolder di allure-results/; Allure membaca
      # semuanya dan menghasilkan satu index.html mandiri (--single-file).
      - name: Generate Allure report
        run: |
          allure generate --single-file --clean -o allure-report allure-results/*
          jq -r '"### Patrol: \(.stats.passed)/\(.stats.total) passed, \(.stats.failed) failed, \(.stats.broken) broken\n\nDownload artifact **allure-report-patrol** lalu buka `index.html`."' allure-report/summary.json >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        with:
          name: allure-report-patrol
          path: allure-report/

name: Patrol E2E

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

env:
  PATROL_CLI_VERSION: 4.9.0
  PATROL_ANALYTICS_ENABLED: "false"

jobs:
  # 1. Build APK app + APK test (instrumentation) sekali dengan Patrol CLI.
  #    Semua file *_test.dart di patrol_test/ ikut di-bundle otomatis.
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.38.10
          channel: stable
          cache: true

      - name: Install Patrol CLI
        run: |
          dart pub global activate patrol_cli "$PATROL_CLI_VERSION"
          echo "$HOME/.pub-cache/bin" >> "$GITHUB_PATH"

      - run: patrol build android --debug

      # Isi artifact: debug/app-debug.apk dan androidTest/debug/app-debug-androidTest.apk
      - uses: actions/upload-artifact@v4
        with:
          name: patrol-apks
          path: build/app/outputs/apk/

  # 2. Test case dibagi ke beberapa job paralel (shard), masing-masing dengan
  #    emulator headless sendiri. Tiap test case hanya jalan di satu shard.
  #    Untuk menambah paralelisme cukup tambah angka di `shard`.
  patrol:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1]
    name: patrol (shard ${{ matrix.shard }})
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: patrol-apks
          path: apk

      # Wajib agar emulator x86_64 bisa pakai akselerasi hardware di runner Linux.
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      # `am instrument` selalu exit 0, jadi lulus/gagal dicek dari baris "OK (".
      # numShards/shardIndex diambil dari matrix, jadi otomatis ikut jumlah shard.
      - name: Run Patrol tests
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          # google_apis = tanpa Play Store, menghindari dialog crash sistem.
          target: google_apis
          arch: x86_64
          disable-animations: true
          # Tiap baris dijalankan terpisah, jadi tulis satu perintah per baris.
          script: |
            adb shell settings put global hide_error_dialogs 1
            adb install -r -t apk/debug/app-debug.apk
            adb install -r -t apk/androidTest/debug/app-debug-androidTest.apk
            adb shell am instrument -w -r -e numShards ${{ strategy.job-total }} -e shardIndex ${{ strategy.job-index }} com.example.testflutter.test/pl.leancode.patrol.PatrolJUnitRunner | tee instrument.log
            grep -q "^OK (" instrument.log

      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: patrol-shard-${{ matrix.shard }}
          path: instrument.log
